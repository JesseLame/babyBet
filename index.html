<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baby Bets</title>
    <meta
      name="description"
      content="A compact light-theme list for tracking every baby bet in one place."
    />
    <meta name="theme-color" content="#f5f1e8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="./script.js"></script>
  </head>
  <body>
    <div class="background">
      <div class="orb orb-one"></div>
      <div class="orb orb-two"></div>
      <div class="grid"></div>
    </div>

    <main class="shell">
      <section class="board card">
        <div class="board-copy">
          <p class="eyebrow">Private baby bet tracker</p>
          <h1>Baby Bets</h1>
        </div>

        <div class="board-tools">
          <span class="count-pill" id="betsCount">0 bets</span>
          <button class="create-button" id="toggleCreate" type="button" aria-expanded="false">
            Create
          </button>
        </div>

        <p class="sync-status" id="syncStatus" role="status" aria-live="polite">
          Open an invite link to join the shared list.
        </p>
      </section>

      <section class="card create-panel" id="createPanel" hidden>
        <div class="section-heading compact">
          <p class="eyebrow">Create</p>
          <h2>New bet</h2>
        </div>

        <form class="create-form" id="createForm">
          <label>
            <span>Predicted name</span>
            <input
              id="predictedName"
              name="predictedName"
              type="text"
              placeholder="Enter the name you are betting on"
              required
            />
          </label>

          <label>
            <span>Predicted date</span>
            <input id="predictedDate" name="predictedDate" type="date" />
          </label>

          <label>
            <span>Guessed by</span>
            <input
              id="stake"
              name="stake"
              type="text"
              placeholder="Enter the person who made the guess"
              required
            />
          </label>

          <label>
            <span>Time</span>
            <input id="predictionNote" name="predictionNote" type="time" required />
          </label>

          <div class="form-actions full-width">
            <button class="secondary" id="cancelCreate" type="button">Cancel</button>
            <button id="submitCreate" type="submit">Add bet</button>
          </div>
        </form>
      </section>

      <section class="card list-panel">
        <div class="section-heading compact">
          <p class="eyebrow">Bets</p>
          <h2>All bets</h2>
        </div>

        <div class="bets-table-wrap">
          <table class="bets-table">
            <thead>
              <tr>
                <th scope="col">Baby name</th>
                <th scope="col">Predicted date</th>
                <th scope="col">Guessed by</th>
                <th scope="col">Time</th>
                <th scope="col">Added</th>
              </tr>
            </thead>
            <tbody id="betsList"></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
