<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baby Bet List</title>
    <meta
      name="description"
      content="A compact light-theme list for tracking every baby bet in one place."
    />
    <meta name="theme-color" content="#f5f1e8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body>
    <div class="background">
      <div class="orb orb-one"></div>
      <div class="orb orb-two"></div>
      <div class="grid"></div>
    </div>

    <main class="shell">
      <section class="board card">
        <div class="board-copy">
          <p class="eyebrow">Private baby bet tracker</p>
          <h1>All bets in one compact list.</h1>
          <p class="lede">
            A light, easy board for recording each bet, keeping the list tidy,
            and syncing the same view when Supabase is connected.
          </p>
        </div>

        <div class="board-tools">
          <span class="count-pill" id="betsCount">0 bets</span>
          <button class="create-button" id="toggleCreate" type="button" aria-expanded="false">
            Create
          </button>
        </div>

        <p class="sync-status" id="syncStatus" role="status" aria-live="polite">
          Open an invite link to join the shared list.
        </p>
      </section>

      <section class="card create-panel" id="createPanel" hidden>
        <div class="section-heading compact">
          <p class="eyebrow">Create</p>
          <h2>New bet</h2>
        </div>

        <form class="create-form" id="createForm">
          <label>
            <span>Predicted name</span>
            <input
              id="predictedName"
              type="text"
              placeholder="Enter the name you are betting on"
              required
            />
          </label>

          <label>
            <span>Predicted date</span>
            <input id="predictedDate" type="date" />
          </label>

          <label>
            <span>Stake</span>
            <input id="stake" type="text" placeholder="Coffee, dinner, bragging rights..." />
          </label>

          <label class="full-width">
            <span>Note</span>
            <textarea
              id="predictionNote"
              rows="3"
              placeholder="Keep the reason short and easy to scan."
            ></textarea>
          </label>

          <div class="form-actions full-width">
            <button class="secondary" id="cancelCreate" type="button">Cancel</button>
            <button id="submitCreate" type="submit">Add bet</button>
          </div>
        </form>
      </section>

      <section class="card list-panel">
        <div class="section-heading compact">
          <p class="eyebrow">Bets</p>
          <h2>All bets</h2>
        </div>

        <ul class="bets-list" id="betsList"></ul>
      </section>
    </main>
  </body>
</html>
